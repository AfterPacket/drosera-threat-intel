title: GSOCKET_SSHIT credential beacon to operator host
id: b295d4e8-1a6c-4f03-8e57-9d2b4c7a6e13
status: experimental
description: |
  Detects the GSOCKET_SSHIT wrapper exfiltrating its gs-netcat access
  credential to the operator's own host.

  The POST body carries three fields: 'data' (the gs-netcat -s "<secret>" -i
  line, which IS the access credential), 'host' (victim hostname) and 'ip'
  (victim public IP, obtained from ifconfig.me).

  This is the one part of the GSOCKET C2 path that is ordinary attacker
  infrastructure. The interactive channel itself runs over the Global Socket
  Relay Network and is addressed by shared secret rather than by host, so it
  cannot be blocked or sinkholed by name or address. This beacon can.

  The public-IP lookup is included as a separate, weaker selection: a server
  querying ifconfig.me is not inherently malicious but rarely has a reason to.
references:
    - https://github.com/Afterpacket/drosera-threat-intel
    - https://github.com/Afterpacket/drosera-threat-intel/blob/main/reports/CAPTURE_20260807_infrastructure_and_sinkhole.md
author: AfterPacket
date: 2026-08-08
tags:
    - attack.exfiltration
    - attack.t1041
    - attack.t1614
    - tlp.white
logsource:
    product: linux
    category: process_creation
detection:
    exfil_endpoint:
        CommandLine|contains:
            - '192.253.248.9/gsocket/up.php'
            - 'gsocket/up.php'
    exfil_host:
        CommandLine|contains: '192.253.248.9'
    public_ip_lookup:
        Image|endswith:
            - '/curl'
            - '/wget'
        CommandLine|contains: 'ifconfig.me'
    condition: exfil_endpoint or exfil_host or public_ip_lookup
falsepositives:
    - The ifconfig.me selection alone will fire on legitimate administrative
      scripts that check a host's public address. Treat that branch as
      informational and the 192.253.248.9 branches as high confidence.
level: high
