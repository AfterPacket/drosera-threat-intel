name: Static repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-free-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r tools/requirements-ci.txt
      - name: Negative regression tests (no samples)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: YARA, Sigma, IOC, SID, coverage and bundle checks
        run: python tools/check_repository.py --rules

  suricata-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install runner-only Suricata engine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends suricata
          sudo systemctl stop suricata || true
          suricata --build-info
      - name: Test all repository signatures with the installed engine
        env:
          OUTPUT: ${{ runner.temp }}/drosera-suricata
        run: |
          mkdir -p "$OUTPUT"
          python3 - <<'PY'
          import os
          from pathlib import Path
          rules = sorted(Path('suricata').glob('*.rules'))
          if not rules:
              raise SystemExit('No Suricata rules found')
          Path(os.environ['OUTPUT'], 'all.rules').write_text(
              '\n'.join(p.read_text(encoding='utf-8') for p in rules), encoding='utf-8')
          PY
          suricata -T --init-errors-fatal -c /etc/suricata/suricata.yaml \
            -S "$OUTPUT/all.rules" -l "$OUTPUT"
